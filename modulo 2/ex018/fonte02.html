<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'kathen';
            src: url('Kathen Font by Situjuh (7NTypes).otf') format('opentype');
            font-weight: normal;
            font-style: normal;

        /* TIPOS DE format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
        */

        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'kathen', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Explicabo totam dolores expedita commodi porro facere vitae tempora dignissimos! Repudiandae maiores aliquam quia voluptate qui temporibus. Aut a neque vitae obcaecati.</p>
</body>
</html>
