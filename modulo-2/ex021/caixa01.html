<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {        /*box-level*/
            
            background-color: lightgray;
            height: 100px;
            width: 600px;
            text-align: center;

            border: 10px solid darkslategray;

            padding: 40px 10px 1px 10px;

            margin: 20px auto 50px auto;

            outline: 10px dashed rgb(255, 0, 0);
        }

        a {     /* inline-level */

            border: 10px solid red;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como isso tudo funciona.</p>
</body>
</html>
